<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15161e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" rx="10" ry="10" fill="url(#bg)" />
  <rect x="1" y="1" width="798" height="248" rx="10" ry="10" fill="none" stroke="#292e42" stroke-width="2" />

  <!-- Terminal Header -->
  <path d="M 0 10 Q 0 0 10 0 L 790 0 Q 800 0 800 10 L 800 40 L 0 40 Z" fill="#101014"/>
  <circle cx="25" cy="20" r="6" fill="#f7768e" />
  <circle cx="45" cy="20" r="6" fill="#e0af68" />
  <circle cx="65" cy="20" r="6" fill="#9ece6a" />
  <text x="400" y="25" font-family="'Courier New', Courier, monospace" font-size="14" fill="#a9b1d6" text-anchor="middle">huda@muliya: ~/workspace</text>

  <!-- Decorative Stars / Grid -->
  <g fill="#292e42">
    <circle cx="150" cy="80" r="1.5" />
    <circle cx="300" cy="120" r="1.5" />
    <circle cx="650" cy="70" r="1.5" />
    <circle cx="700" cy="180" r="2.5" />
    <circle cx="100" cy="200" r="1.5" />
    <circle cx="450" cy="160" r="1" />
    <circle cx="550" cy="220" r="1" />
  </g>

  <!-- Title -->
  <text x="50" y="110" font-family="'Courier New', Courier, monospace" font-size="56" fill="#7dcfff" font-weight="bold" filter="url(#glow)">Huda Muliya</text>
  
  <!-- Subtitle -->
  <text x="50" y="155" font-family="'Courier New', Courier, monospace" font-size="22" fill="#bb9af7">Frontend Developer <tspan fill="#565f89">|</tspan> UI Engineer</text>
  
  <!-- Command prompt -->
  <text x="50" y="210" font-family="'Courier New', Courier, monospace" font-size="16" fill="#a9b1d6">
    <tspan fill="#9ece6a">➜</tspan> 
    <tspan fill="#7dcfff">~</tspan> 
    ./build_awesome_ui.sh <tspan fill="#bb9af7" font-weight="bold">_</tspan>
  </text>

  <!-- Large Bracket Decoration on Right -->
  <text x="750" y="190" font-family="'Courier New', Courier, monospace" font-size="160" fill="#24283b" text-anchor="end" font-weight="bold">}</text>
</svg>
